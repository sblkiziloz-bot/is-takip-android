name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle --no-daemon :app:assembleDebug

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk Is-Takip-v1.0.0.apk

      - name: APK'yı çıktı olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Is-Takip-APK
          path: Is-Takip-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
